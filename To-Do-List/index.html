<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="list">
        <h1>MY TO-DO-LIST</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="home-work" name="home-work" />
                <label for="home-work">Complete all assigned tasks and review answers before
                    submission.</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://www.freecodecamp.org/learn/responsive-web-design-v9/lab-stylized-to-do-list/build-a-stylized-to-do-list"
                            class="sub-item-link" target="_blank">Homework</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="groceries" name="groceries" />
                <label for="groceries">Purchase essential items like vegetables, milk, bread, and
                    fruits.</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://springonthego.co.ke/?trueroas=23345321445&gad_source=1&gad_campaignid=23345321445&gbraid=0AAAAA_XJY6jBhC49Qz4r7K1QClBCtIfz-&gclid=Cj0KCQjwof_QBhCgARIsADaMzOeDsLHfXfunFioorgaLMXog6AZXNBp87jgTZ1tHkpoALSsenJB3CZ4aAsXMEALw_wcB"
                            class="sub-item-link" target="_blank">Groceries store</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="cleaning" name="cleaning" />
                <label for="cleaning">Organize the desk, sweep the floor, and arrange books
                    neatly.</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://www.youtube.com/watch?v=C1joN9_r3RI" class="sub-item-link"
                            target="_blank">cleaning Guidance</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="email" name="email" />
                <label for="email">Check inbox and respond to important messages.</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://mail.google.com/mail/u/0/#inbox" class="sub-item-link" target="_blank">My
                            Inbox</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
